syntax = "proto3";
package cloudquery.plugin.v3;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/cloudquery/plugin-pb-go/pb/plugin/v3;plugin";
option java_package = "io.cloudquery.plugin.v3";
option java_multiple_files = true;

service Plugin {
  // Get the name of the plugin
  rpc GetName(GetName.Request) returns (GetName.Response);
  // Get the current version of the plugin
  rpc GetVersion(GetVersion.Request) returns (GetVersion.Response);
  // Get plugin spec schema.
  // This will allow validating the input even before calling Init.
  // Should be called before Init.
  rpc GetSpecSchema(GetSpecSchema.Request) returns (GetSpecSchema.Response);
  // Configure the plugin with the given credentials and mode
  rpc Init(Init.Request) returns (Init.Response);
  // Get all tables the source plugin supports. Must be called after Init
  rpc GetTables(GetTables.Request) returns (GetTables.Response);
  // Start a sync on the source plugin. It streams messages as output.
  rpc Sync(Sync.Request) returns (stream Sync.Response);
  // Start a Read on the source plugin for a given table and schema. It streams messages as output.
  // The plugin assume that that schema was used to also write the data beforehand
  rpc Read(Read.Request) returns (stream Read.Response);
  // Write resources. Write is the mirror of Sync, expecting a stream of messages as input.
  rpc Write(stream Write.Request) returns (Write.Response);
  // Transform resources.
  rpc Transform(stream Transform.Request) returns (stream Transform.Response);
  // Transform schemas.
  rpc TransformSchema(TransformSchema.Request) returns (TransformSchema.Response);
  // Send signal to flush and close open connections
  rpc Close(Close.Request) returns (Close.Response);
  // Validate and test the connections used by the plugin
  rpc TestConnection(TestConnection.Request) returns (TestConnection.Response);
  // Assess how the destination plugin would apply table schema changes, without writing anything.
  // Plugins that do not support assessment return Unimplemented.
  rpc AssessTables(AssessTables.Request) returns (AssessTables.Response);
  // Write resources, like Write, and also accept Write.MessageFlush.
  // The plugin sends one Write.Response per Write.MessageFlush, once it has tried to commit every message sent before
  // the flush. Write.Response.flush_error is set if some messages sent since the previous flush may not have been
  // committed.
  // Only use it with plugins that set Init.Response.supports_flush.
  rpc WriteStream(stream Write.Request) returns (stream Write.Response);
}

message GetName {
  message Request {}
  message Response {
    string name = 1;
  }
}

message GetVersion {
  message Request {}
  message Response {
    string version = 1;
  }
}

message GetSpecSchema {
  message Request {}
  message Response {
    // Should be a valid JSON schema for the plugin spec.
    // See https://json-schema.org for more details.
    optional string json_schema = 1;
  }
}

message Init {
  message Request {
    bytes spec = 1; // Internal plugin-specific spec
    bool no_connection = 2; // A flag to indicate plugins should skip establishing a connection
    string invocation_id = 3; // unique execution_id that will identify the invocation (sync, migrate etc)
  }
  message Response {
    // The plugin supports WriteStream and Write.MessageFlush
    bool supports_flush = 1;
  }
}

message GetTables {
  message Request {
    repeated string tables = 1;
    repeated string skip_tables = 2;
    bool skip_dependent_tables = 3;
  }
  message Response {
    // marshalled []arrow.Schema
    repeated bytes tables = 1;
  }
}

message Sync {
  message MessageInsert {
    // marshalled arrow.Record
    bytes record = 1;
  }
  message MessageMigrateTable {
    // marshalled arrow.Schema
    bytes table = 1;
  }
  message MessageDeleteRecord {
    string table_name = 1;
    repeated PredicatesGroup where_clause = 2;
    repeated TableRelation table_relations = 3;
  }
  message MessageError {
    string table_name = 1;
    string error = 2;
  }
  // State backend rows to persist once every message sent before the checkpoint is committed to all destinations.
  // Only sent when Sync.Request.supports_checkpoints is set.
  //
  // The record must:
  // - have the cq:table_name schema metadata set to Sync.BackendOptions.table_name
  // - have a "key" column and a "value" column, both of the arrow utf8 type (not large_utf8)
  // - have a "version" column of the arrow uint64 type, if the state table has one
  // - hold only the keys that changed. Each row is an upsert of its key; keys not in the record keep their state.
  // When the same key is in several checkpoints, the row with the highest version wins, or the last row without a version column.
  message MessageCheckpoint {
    // marshalled arrow.Record
    bytes record = 1;
  }


  message BackendOptions {
    // table name to use for state backend
    string table_name = 1;
    // connection path to use for state backend
    string connection = 2;
  }
  message Request {
    message Shard {
      int32 num = 1;
      int32 total = 2;
    }
    repeated string tables = 1;
    repeated string skip_tables = 2;
    bool skip_dependent_tables = 3;
    bool deterministic_cq_id = 4;
    BackendOptions backend = 5;
    optional Shard shard = 6;
    bool withErrorMessages = 7; // If true, the plugin will send error messages in the response stream
    // If true, the client persists state backend writes from Sync.MessageCheckpoint,
    // so the plugin sends them on the stream instead of writing to the state backend
    bool supports_checkpoints = 8;
  }
  message Response {
    oneof message {
      Sync.MessageMigrateTable migrate_table = 1;
      Sync.MessageInsert insert = 2;
      Sync.MessageDeleteRecord delete_record = 3;
      Sync.MessageError error = 4;
      Sync.MessageCheckpoint checkpoint = 5;
    }
  }
}

message Read {
  message Request {
    // marshalled arrow.Schema
    bytes table = 1;
  }
  message Response {
    // marshalled arrow.Record
    bytes record = 1;
  }
}

message TableRelation {
  string table_name = 1;
  string parent_table = 2;
}



message Predicate {
  enum Operator {
    EQ = 0;
    // LT = 1;
    // LTE = 2;
    // GT = 3;  
    // GTE = 4;
  }

  Operator operator = 1;
  string column = 2;
  // marshalled arrow.Record
  bytes record = 3;
}

message PredicatesGroup {
  enum GroupingType {
    AND = 0;
    OR = 1;
  }
  GroupingType grouping_type = 1;
	repeated Predicate predicates = 2;

}

message Write {
  message MessageMigrateTable {
    // marshalled arrow.Schema
    bytes table = 1;
    bool migrate_force = 2;
  }
  message MessageInsert {
    // marshalled arrow.Record
    bytes record = 1;
  }
  message MessageDeleteStale {
    // marshalled arrow.Schema
    bytes table = 1 [deprecated = true];
    string source_name = 2;
    google.protobuf.Timestamp sync_time = 3;
    string table_name = 4;
  }
  message MessageDeleteRecord {
    string table_name = 1;
    repeated PredicatesGroup where_clause = 2;
    repeated TableRelation table_relations = 3;
  }
  // Commit every message sent before this one. Only valid on WriteStream.
  message MessageFlush {
    uint64 id = 1;
  }
  message Request {
    oneof message {
      Write.MessageMigrateTable migrate_table = 1;
      Write.MessageInsert insert = 2;
      Write.MessageDeleteStale delete = 3;
      Write.MessageDeleteRecord delete_record = 4;
      Write.MessageFlush flush = 5;
    }
  }
  message Response {
    // WriteStream only: id of the Write.MessageFlush that completed
    uint64 flush_id = 1;
    // WriteStream only: why some messages sent since the previous flush may not have been committed. A failure may be
    // reported only once, so a later flush can succeed although earlier messages were lost: clients must treat the
    // first failure as final. A plugin may end the stream after reporting a failure, or instead of reporting it.
    string flush_error = 2;
    // WriteStream only: with flush_error, the tables whose messages may not have been committed. Empty if the plugin
    // cannot tell, in which case messages of any table may have been lost.
    repeated string failed_tables = 3;
  }
}

message Transform {
  message Request {
    // marshalled arrow.Record
    bytes record = 1;
  }
  message Response {
    // marshalled arrow.Record
    bytes record = 1;
  }
}

message TransformSchema {
  message Request {
    // marshalled arrow.Schema
    bytes schema = 1;
  }
  message Response {
    // marshalled arrow.Schema
    bytes schema = 1;
  }
}

message Close {
  message Request {}
  message Response {}
}

message TestConnection {
  message Request{
    bytes spec = 1; // Internal plugin-specific spec
  }
  message Response{
    bool success = 1;
    string failure_code = 2;
    string failure_description = 3;
  }
}

message AssessTables {
  // TABLE_REMOVED applies to tables only, all other values apply to tables and columns
  enum Category {
    CATEGORY_UNKNOWN = 0;
    CATEGORY_NO_CHANGE = 1;
    CATEGORY_AUTOMATICALLY_MIGRATABLE = 2;
    CATEGORY_MANUAL_MIGRATION_REQUIRED = 3;
    CATEGORY_TABLE_REMOVED = 4;
    CATEGORY_FILE_SCHEMA_CHANGED = 5;
  }
  message TablePair {
    // marshalled arrow.Schema, empty when the table is added
    bytes old_table = 1;
    // marshalled arrow.Schema, empty when the table is removed
    bytes new_table = 2;
  }
  message Evidence {
    string synthetic_value = 1;
    // Destination output for the synthetic value under the old and new schemas
    string before = 2;
    string after = 3;
  }
  // Safe mode is a migration with migrate_force false, forced mode with migrate_force true
  message ColumnFinding {
    string column_name = 1;
    Category category = 2;
    // Destination types, empty when the column is added or removed
    string old_type = 3;
    string new_type = 4;
    string safe_mode_behavior = 5;
    string forced_mode_behavior = 6;
    repeated Evidence evidence = 7;
  }
  message TableFinding {
    string table_name = 1;
    Category category = 2;
    string safe_mode_behavior = 3;
    string forced_mode_behavior = 4;
    repeated ColumnFinding columns = 5;
    repeated Evidence evidence = 6;
    // Non-empty when the assessment could not cover the whole table
    string incomplete_coverage_reason = 7;
  }
  message Request {
    repeated TablePair tables = 1;
    bool migrate_force = 2;
  }
  message Response {
    repeated TableFinding tables = 1;
  }
}
